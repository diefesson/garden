{% extends "base.html" %}

{% block content %}
<header>
  <h1>{{ page.title }}</h1>
  <p>{{page.description}}</p>
  <div>
    {% if page.authors %}
    <span>🦊 {{ page.authors | join(sep=", ") }}</span>
    {% endif %}
    {% if page.date %}
    <span>📅 {{ page.date }}</span>
    {% endif %}
  </div>
</header>
{{ page.content | safe }}
{% endblock content %}
